version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: zeego-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: zeego
      POSTGRES_PASSWORD: zeegopassword123
      POSTGRES_DB: zeego_dispatch
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zeego -d zeego_dispatch"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: zeego-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  redisdata:
